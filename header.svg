<svg viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arunkumar V — Software Engineer and ML Researcher">
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#161b22"/>
    </pattern>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b949e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9d1d9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e7681" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="#0d1117"/>
  <rect width="1200" height="220" fill="url(#dots)"/>

  <rect x="120" y="0" width="2" height="220" fill="url(#bar)"/>

  <text x="160" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="500" fill="#e6edf3" letter-spacing="-0.5">
    Arunkumar V
  </text>

  <text x="160" y="132" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#c9d1d9">
    Software Engineer · ML Researcher
  </text>

  <text x="160" y="165" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="13" fill="#8b949e">
    Tiruchirappalli, India · github.com/akv2011
  </text>

  <g transform="translate(960, 60)">
    <line x1="20" y1="20" x2="90" y2="40" stroke="url(#edgeGrad)" stroke-width="1.2"/>
    <line x1="90" y1="40" x2="40" y2="100" stroke="url(#edgeGrad)" stroke-width="1.2"/>
    <line x1="20" y1="20" x2="40" y2="100" stroke="url(#edgeGrad)" stroke-width="1.2"/>
    <line x1="90" y1="40" x2="150" y2="80" stroke="url(#edgeGrad)" stroke-width="1.2"/>
    <line x1="40" y1="100" x2="150" y2="80" stroke="url(#edgeGrad)" stroke-width="1.2"/>
    <line x1="150" y1="80" x2="180" y2="20" stroke="url(#edgeGrad)" stroke-width="1.2"/>
    <line x1="90" y1="40" x2="180" y2="20" stroke="url(#edgeGrad)" stroke-width="1.2"/>

    <g>
      <circle cx="20" cy="20" r="4" fill="#0d1117" stroke="#8b949e" stroke-width="1.5">
        <animate attributeName="r" values="4;5.5;4" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="90" cy="40" r="4" fill="#0d1117" stroke="#8b949e" stroke-width="1.5">
        <animate attributeName="r" values="4;5.5;4" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="100" r="4" fill="#0d1117" stroke="#8b949e" stroke-width="1.5">
        <animate attributeName="r" values="4;5.5;4" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="80" r="4" fill="#0d1117" stroke="#8b949e" stroke-width="1.5">
        <animate attributeName="r" values="4;5.5;4" dur="3.2s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="20" r="4" fill="#0d1117" stroke="#8b949e" stroke-width="1.5">
        <animate attributeName="r" values="4;5.5;4" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <line x1="120" y1="200" x2="1080" y2="200" stroke="#21262d" stroke-width="1"/>
</svg>
