name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: ["main"]
    paths: [".github/workflows/metrics.yml"]
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# PRIVACY POSTURE
#
# affiliations: owner, collaborator, organization_member
#   Aggregates (language %, line counts, habits, calendar heatmap) include
#   data from ALL your work — personal repos + OSS collaborations + employer
#   org repos that your PAT can read. This is intentional: richer stats.
#
# activity_visibility: public
#   The recent-activity FEED only shows public events. No private commit
#   timestamps or private repo names ever appear, regardless of affiliations.
#
# followup_sections: user
#   Followup shows user-aggregate only (your overall issue/PR completion
#   rate), not per-repo names.
#
# repositories_skipped: ""
#   If a specific repo should never feed into stats (super-sensitive client
#   work, etc.), add its full name here, e.g. "armoriq/internal-secret-repo".
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ─── 1. Overview + isocalendar + lifetime calendar ────────────────────
      - name: Overview + isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: akv2011
          template: classic
          filename: metrics.svg

          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no
          repositories_skipped: ""
          # commits_authoring: arun.personal@gmail.com   # personal emails ONLY (this file is public)

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_calendar: yes
          plugin_calendar_limit: 0

      # ─── 2. Languages (aggregates from all affiliated repos) ──────────────
      - name: Languages (detailed)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: akv2011
          filename: metrics.plugin.languages.svg
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no
          repositories_skipped: ""

          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, scss, less, dockerfile, makefile, batchfile,
            shell, jupyter notebook, tex, json, yaml, xml
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_indepth: yes
          plugin_languages_limit: 10
          plugin_languages_analysis_timeout: 45
          plugin_languages_categories: programming, markup
          plugin_languages_sections: most-used
          plugin_languages_colors: github

      # ─── 3. Habits (when/how you code, aggregated) ────────────────────────
      - name: Coding habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: akv2011
          filename: metrics.plugin.habits.svg
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no
          repositories_skipped: ""

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_trim: yes
          plugin_habits_languages_limit: 8

      # ─── 4. Achievements (GitHub-wide, no repo data) ──────────────────────
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: akv2011
          filename: metrics.plugin.achievements.svg
          base: ""

          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0

      # ─── 5. Recent activity (PUBLIC events only — broad scope safe) ───────
      - name: Recent activity (public only)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: akv2011
          filename: metrics.plugin.activity.svg
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no
          repositories_skipped: ""

          plugin_activity: yes
          plugin_activity_limit: 7
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes

      # ─── 6. Followup (user-aggregate only, no per-repo names) ─────────────
      - name: Followup
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: akv2011
          filename: metrics.plugin.followup.svg
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no
          repositories_skipped: ""

          plugin_followup: yes
          plugin_followup_sections: user
          plugin_followup_indepth: yes
          plugin_followup_archived: no
